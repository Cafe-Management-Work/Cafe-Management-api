server:
  port: 8080

spring:
  application:
    name: cafe-management-api

  datasource:
    url: jdbc:mysql://${RDS_HOST}:3306/cafeManagement?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      database-platform: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: "*"

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false